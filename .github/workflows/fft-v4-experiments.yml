name: DUCC FFT V4 heuristic experiments

on:
  push:
    branches:
      - test/fft-v4-static-heuristics
  workflow_dispatch:
    inputs:
      samples:
        description: Timing samples per case
        type: number
        default: 7
      sample_ms:
        description: Approximate milliseconds per timing sample
        type: number
        default: 6

permissions:
  contents: read

jobs:
  fft-experiments:
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    env:
      CFLAGS: -march=x86-64-v2
      CXXFLAGS: -march=x86-64-v2
    steps:
      - name: Require AVX-512 before checkout or build
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lines = Path("/proc/cpuinfo").read_text().splitlines()
          model = next((line.partition(":")[2].strip()
                        for line in lines if line.startswith("model name")), "unknown")
          flags = next((set(line.partition(":")[2].split())
                        for line in lines if line.startswith("flags")), set())
          needed = {"avx512f", "avx512cd", "avx512bw", "avx512dq", "avx512vl"}
          missing = sorted(needed - flags)
          print(f"Runner CPU: {model}", flush=True)
          if missing:
              raise SystemExit(
                  f"x86-64-v4 unavailable (missing: {', '.join(missing)}). "
                  "Re-run this job to try a different hosted CPU."
              )
          print("AVX-512 preflight passed.", flush=True)
          PY

      - name: Checkout benchmark driver and experiment commits
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build and test dependencies
        run: python -m pip install --group dev-cli --group test-core

      - name: Preserve experiment driver and select benchmark CPU
        run: |
          cp .github/scripts/fft_v4_experiments.py "$RUNNER_TEMP/fft_v4_experiments.py"
          echo "FFT_BENCH_CPU=$(python -c 'import os; print(min(os.sched_getaffinity(0)))')" >> "$GITHUB_ENV"
          command -v taskset

      - name: Build, test and compare all pinned variants
        run: |
          python "$RUNNER_TEMP/fft_v4_experiments.py" suite \
            --cpu "$FFT_BENCH_CPU" \
            --directory "$RUNNER_TEMP/fft-v4-experiments" \
            --samples "${{ inputs.samples || 7 }}" \
            --sample-ms "${{ inputs.sample_ms || 6 }}"
          cat "$RUNNER_TEMP/fft-v4-experiments/REPORT.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload per-case results, samples and build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fft-v4-heuristic-experiments
          path: ${{ runner.temp }}/fft-v4-experiments/
          if-no-files-found: ignore
